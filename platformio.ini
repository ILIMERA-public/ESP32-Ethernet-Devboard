; İLİMERA ESP32 Ethernet Devboard — PlatformIO yapılandırması
;
; Derlemek istediğiniz örneği src_dir satırına yazın, ardından:
;   pio run -t upload
;   pio device monitor -b 115200
;
; Not: Bu yapılandırma ESP32 Arduino çekirdeği 2.x ile gelen resmî "espressif32"
; platformunu kullanır. Çekirdek 3.x için platform satırını şu adresle değiştirin:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

[platformio]
src_dir = examples/01_Ethernet_Baglanti_Testi
; src_dir = examples/02_Statik_IP
; src_dir = examples/03_Web_Sunucu_GPIO_Kontrol
; src_dir = examples/04_MQTT_Telemetri
; src_dir = examples/05_Ethernet_WiFi_Yedekli

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps = knolleary/PubSubClient@^2.8     ; yalnız 04_MQTT_Telemetri kullanır
